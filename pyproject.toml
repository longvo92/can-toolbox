[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "can-toolbox"
version = "0.8.0"
description = "Desktop toolbox for CAN engineers: compare DBC baselines in Excel and convert BLF logs to MATLAB"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Long Vo Thien" }]
keywords = ["dbc", "can", "can-bus", "automotive", "cantools", "diff", "baseline", "excel", "report", "blf", "matlab", "simulink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "cantools>=40.3.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7.0"]

[project.urls]
Homepage = "https://github.com/longvo92/can-toolbox"
Issues = "https://github.com/longvo92/can-toolbox/issues"
Changelog = "https://github.com/longvo92/can-toolbox/blob/main/CHANGELOG.md"

[project.scripts]
can-toolbox-cli = "can_toolbox.cli:main"

[project.gui-scripts]
can-toolbox = "can_toolbox.ui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]
