# Synthetic example, schema version 2. The same content can be written as
# JSON or TXT; Export reads whichever file you select.
version: 2
# Skip Excel template rows containing any of these words (case-insensitive).
excel_skip_keywords: []
interfaces:
  - name: VehicleInputs
    side: input
    elements:
      - element: VehicleSpeed
        dtype: single
        can_signal: VehicleSpeedCAN
        # CAN decode -> status mapping -> formula -> datatype
        status_mapping: {10: 1, 20: 2}
        formula: "/10"
      - element: Enable
        dtype: boolean
        # A constant input: never decoded from CAN, held for the whole log.
        value: true
  - name: ControllerOutputs
    side: output
    elements:
      - element: Request
        dtype: uint8
        can_signal: RequestCAN
