name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        # Keep Python 3.9 available when ubuntu-latest advances.
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # The test suite exercises the comparison engine only, so the Qt UI
        # dependency (PySide6) is deliberately not installed here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cantools>=40.3.0" "openpyxl>=3.1.0"
          python -m pip install -e . --no-deps
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run the engine smoke test
        run: python scripts/smoke.py

  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI dependencies
        run: python -m pip install -e ".[gui]"
      - name: Exercise GUI input and ECU pairing
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_ui_inputs -v
